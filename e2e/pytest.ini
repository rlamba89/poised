[pytest]
testpaths = journeys
# Headless by default (add --headed to watch). A failed test keeps its Playwright trace in
# e2e/test-results/<test>/; see README.md, "Reading a trace".
addopts = --tracing retain-on-failure --output test-results -p no:cacheprovider
markers =
    dev_login: needs the dev sign-in (local only); skipped where staff sign in with Cognito (QA, S12)
    cognito_only: runs only where staff sign in with Cognito (QA, S12)
